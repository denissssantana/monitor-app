<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONITOR — IMC</title>
  <script>
    (function () {
      var theme = localStorage.getItem("monitor_theme") || "dark";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">IMC</h1>
    <div class="topbar__actions">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema">
        <svg class="icon-sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path>
        </svg>
      </button>
      <button
        id="menu-toggle"
        class="hamburger"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="nav-menu"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div id="nav-overlay" class="nav-overlay"></div>
  <nav id="nav-menu" class="nav-menu" aria-hidden="true">
    <p class="nav-menu__title">Menu</p>
    <a href="dashboard.html" class="nav-menu__link">Dashboard</a>
    <a href="dados-pessoais.html" class="nav-menu__link">Dados Pessoais</a>
    <a href="imc.html" class="nav-menu__link nav-menu__link--active">IMC</a>
    <a href="registro-alimentar.html" class="nav-menu__link">Registro Alimentar</a>
    <a href="exercicio-fisico.html" class="nav-menu__link">Exercício Físico</a>
    <button id="menu-sair" class="nav-menu__link nav-menu__link--exit" type="button">Sair</button>
  </nav>

  <main class="container">
    <form id="form-imc" class="card" novalidate>
      <div class="field">
        <label for="data-imc">Data</label>
        <input type="date" id="data-imc" name="data-imc" required />
      </div>

      <div class="field">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" name="peso" step="0.1" min="0" inputmode="decimal" required />
      </div>

      <div class="field">
        <label for="altura">Altura (cm)</label>
        <input type="number" id="altura" name="altura" step="0.1" min="0" inputmode="decimal" required />
      </div>

      <p id="imc-feedback" class="form-feedback"></p>

      <div class="actions">
        <button type="submit" class="btn btn-primary btn-block">Calcular</button>
        <button type="button" id="btn-novo-calculo" class="btn btn-secondary btn-block">Novo cálculo</button>
      </div>
    </form>

    <section class="list-card">
      <p class="list-card__title">Histórico de Registros</p>
      <ul id="imc-lista" class="record-list"></ul>
      <p id="imc-lista-empty" class="chart-empty hidden">Nenhum registro ainda. Calcule seu primeiro IMC.</p>
    </section>

    <section class="chart-card">
      <p class="chart-card__title">Evolução do IMC</p>
      <canvas id="grafico-imc" height="220"></canvas>
      <p id="chart-empty" class="chart-empty hidden">Nenhum registro ainda. Calcule seu primeiro IMC.</p>
    </section>

    <div class="actions">
      <a href="dashboard.html" class="btn btn-secondary btn-block">Voltar</a>
    </div>
  </main>

  <div id="modal-editar-imc" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-editar-imc-title">
      <h2 id="modal-editar-imc-title" class="modal__title">Editar Registro</h2>
      <form id="form-editar-imc" novalidate>
        <div class="field">
          <label for="editar-data">Data</label>
          <input type="date" id="editar-data" required />
        </div>

        <div class="field">
          <label for="editar-peso">Peso (kg)</label>
          <input type="number" id="editar-peso" step="0.1" min="0" inputmode="decimal" required />
        </div>

        <div class="field">
          <label for="editar-altura">Altura (cm)</label>
          <input type="number" id="editar-altura" step="0.1" min="0" inputmode="decimal" required />
        </div>

        <p id="editar-imc-feedback" class="form-feedback"></p>

        <div class="actions">
          <button type="submit" class="btn btn-primary btn-block">Salvar</button>
          <button type="button" id="btn-cancelar-edicao" class="btn btn-secondary btn-block">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/imc.js"></script>
</body>
</html>
