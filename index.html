<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONITOR</title>
  <script>
    (function () {
      var theme = localStorage.getItem("monitor_theme") || "dark";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="splash">
    <button
      id="theme-toggle"
      class="theme-toggle splash__theme-toggle"
      type="button"
      aria-label="Alternar tema"
    >
      <svg class="icon-sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path>
      </svg>
    </button>

    <p class="splash__badge">Treino &middot; Disciplina &middot; Evolução</p>
    <h1 class="splash__title">MONI<span>TOR</span></h1>
    <p class="splash__tagline">Acompanhe seus dados e sua evolução física sem desculpa.</p>

    <div class="splash__actions">
      <a href="dashboard.html" class="btn btn-primary btn-block">Entrar</a>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
